<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Connect | Invoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .accent-text { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6rem; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="caspio-sessions" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <div id="caspio-invoice" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <iframe id="caspio-invoice-frame" name="caspio-invoice-frame" style="position:absolute;left:-9999px;top:-9999px;" width="0" height="0" frameborder="0"></iframe>

    <div class="max-w-2xl mx-auto px-4 py-10 fade-in">

        <div class="mb-8 flex items-center justify-between">
            <button onclick="goBack()" class="flex items-center gap-2 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </button>
            <div class="flex items-center gap-3 italic font-black text-lg uppercase tracking-tighter text-slate-800">
                <i class="fas fa-handshake-angle text-blue-500"></i>
                COACH <span class="text-blue-500">CONNECT</span>
            </div>
        </div>

        <section class="glass-card p-8 lg:p-10 relative overflow-hidden">
            
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-10 flex flex-col items-center justify-center transition-opacity duration-300">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-4"></i>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Calculating Sessions...</p>
            </div>

            <div class="mb-10 flex justify-between items-start">
                <div>
                    <span class="accent-text text-blue-600 block mb-2">Automated Billing</span>
                    <h2 class="text-2xl font-black italic text-slate-900 uppercase leading-none">Create Invoice</h2>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">Invoice #</p>
                    <p class="text-sm font-black italic text-slate-400" id="invoice-number">—</p>
                </div>
            </div>

            <div class="space-y-8">

                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest">Project</label>
                    <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-briefcase text-xs"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-800 italic truncate" id="project-name">Loading project...</p>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-[10px] font-black uppercase tracking-widest mb-2">
                        <span class="text-blue-600">Billed Hours</span>
                        <span class="text-slate-400">Max 10 Hrs Limit</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all duration-1000 w-0"></div>
                    </div>
                    <p class="text-right text-[9px] font-bold text-slate-400 mt-2 italic" id="hours-detail">0.0 / 10.0 hrs logged</p>
                </div>

                <div class="pt-6 border-t border-slate-100">
                    <div class="bg-slate-900 rounded-2xl p-6 space-y-4 shadow-xl">
                        <div class="flex justify-between items-center border-b border-white/10 pb-4">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Approved Hours</span>
                            <span class="text-sm font-black italic text-white" id="total-hours">0.0 hrs</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-white/10 pb-4">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Rate per Hour</span>
                            <span class="text-sm font-black italic text-white">$192.35</span>
                        </div>
                        <div class="pt-2 flex justify-between items-center">
                            <span class="text-sm font-black italic text-blue-400 uppercase">Total Amount</span>
                            <span class="text-3xl font-black italic text-white" id="total-amount">$0.00</span>
                        </div>
                    </div>
                </div>

                <button id="submit-btn" onclick="submitInvoice()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.3em] shadow-xl hover:bg-blue-500 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Submit Invoice
                </button>
            </div>
        </section>
    </div>

<script>
    const RATE = 192.35;
    const MAX_HOURS = 10;
    const MAX_SECONDS = MAX_HOURS * 3600;

    let totalSeconds = 0; 
    let billedSeconds = 0; 
    let billedAmount = 0;

    document.getElementById('invoice-number').textContent = 'INV-' + Date.now().toString().slice(-6);

    const params       = new URLSearchParams(window.location.search);
    const matchId      = params.get('match_id') || sessionStorage.getItem('match_id') || '';
    const coachUid     = params.get('coach_uid') || sessionStorage.getItem('uid') || '';
    const coacheeUid   = params.get('coachee_uid') || sessionStorage.getItem('coachee_uid') || '';
    const projectTitle = params.get('project_title') || sessionStorage.getItem('project_title') || 'Project ID: ' + (matchId || 'Unknown');

    document.getElementById('project-name').textContent = projectTitle;

    function goBack() {
        const uid = sessionStorage.getItem('uid') || '';
        const name = sessionStorage.getItem('name') || '';
        window.location.href = 'coach.html?uid=' + encodeURIComponent(uid) + '&name=' + encodeURIComponent(name);
    }

    function loadSessionTime() {
        if (!matchId) {
            alert('No project selected.');
            return;
        }

        const container = document.getElementById('caspio-sessions');
        container.innerHTML = '';
        const s = document.createElement('script');
        
        s.src = 'https://c0abr823.caspio.com/dp/1c9f50005c639e4534ab444793af/emb?match_id=' + encodeURIComponent(matchId) + '&cbCache=' + Date.now();
        container.appendChild(s);

        let tries = 0;
        (function poll() {
            const table = container.querySelector('table');
            const noRecords = (container.textContent || '').includes('No records');
            
            if (table || noRecords) {
                totalSeconds = 0;
                if (table) {
                    table.querySelectorAll('tr').forEach(row => {
                        const cells = row.querySelectorAll('td');
                        if (cells.length > 0) {
                            const sec = parseInt(cells[0].textContent.replace(/[^0-9]/g, ''), 10) || 0;
                            totalSeconds += sec;
                        }
                    });
                }
                updateInvoiceUI();
            } else if (tries++ < 40) {
                setTimeout(poll, 300);
            } else {
                alert('Failed to load session data. Please refresh.');
            }
        })();
    }

    function updateInvoiceUI() {
        billedSeconds = Math.min(totalSeconds, MAX_SECONDS);
        billedAmount = (billedSeconds / 3600) * RATE;
        
        const totalHrsRaw = (totalSeconds / 3600).toFixed(1);
        const billedHrs = (billedSeconds / 3600).toFixed(1);
        
        let progressPct = (billedSeconds / MAX_SECONDS) * 100;
        setTimeout(() => {
            document.getElementById('progress-bar').style.width = progressPct + '%';
        }, 100);

        let detailText = `${totalHrsRaw} hrs logged`;
        if (totalSeconds > MAX_SECONDS) {
            detailText += ` (Capped at 10.0 hrs)`;
            document.getElementById('hours-detail').classList.replace('text-slate-400', 'text-red-500');
        }
        document.getElementById('hours-detail').textContent = detailText;
        
        document.getElementById('total-hours').textContent = billedHrs + ' hrs';
        document.getElementById('total-amount').textContent = '$' + billedAmount.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        const overlay = document.getElementById('loading-overlay');
        overlay.style.opacity = '0';
        setTimeout(() => overlay.style.display = 'none', 300);
    }

    function submitInvoice() {
        if (billedSeconds <= 0) {
            alert('No completed sessions to bill for this project yet.');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.textContent = 'Submitting...';
        btn.disabled = true;

        const container = document.getElementById('caspio-invoice');
        container.innerHTML = '';
        const s = document.createElement('script');
        s.src = 'https://c0abr823.caspio.com/dp/1c9f5000a748797f30914d2e8e19/emb';
        container.appendChild(s);

        let tries = 0;
        (function poll() {
            const form = container.querySelector('form');
            if (form) {
                const fMatch   = form.querySelector('input[name*="Match_ID"]');
                const fCoach   = form.querySelector('input[name*="Coach_UID"]');
                const fCoachee = form.querySelector('input[name*="Coachee_UID"]');
                const fBilledSec = form.querySelector('input[name*="Billed_Seconds"]');
                const fBilledAmt = form.querySelector('input[name*="Billed_Amount"]');
                const fStatus  = form.querySelector('input[name*="Status"]');

                if (fMatch) fMatch.value = matchId;
                if (fCoach) fCoach.value = coachUid;
                if (fCoachee) fCoachee.value = coacheeUid;
                if (fBilledSec) fBilledSec.value = Math.floor(billedSeconds);
                if (fBilledAmt) fBilledAmt.value = billedAmount.toFixed(2);
                if (fStatus) fStatus.value = 'Pending'; 

                form.target = 'caspio-invoice-frame';
                
                document.getElementById('caspio-invoice-frame').onload = function() {
                    document.getElementById('caspio-invoice-frame').onload = null;
                    alert('Invoice successfully submitted for $' + billedAmount.toFixed(2));
                    goBack();
                };
                
                form.submit();
            } else if (tries++ < 30) {
                setTimeout(poll, 300);
            } else {
                alert('Submission failed. Please try again.');
                btn.textContent = 'Submit Invoice';
                btn.disabled = false;
            }
        })();
    }

    loadSessionTime();
</script>

</body>
</html>
