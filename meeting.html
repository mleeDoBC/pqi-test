<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Coach Connect | Meeting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .accent-text { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.6rem; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 1024px) { body { overflow: hidden; } }


        .agenda-item { display: flex; align-items: flex-start; gap: 16px; padding: 16px 20px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; font-size: 14px; font-style: italic; cursor: pointer; transition: all 0.2s; }
        .agenda-item:hover { background: rgba(255,255,255,0.08); }
        .agenda-item.done { opacity: 0.4; text-decoration: line-through; }
        .agenda-item i { color: #3b82f6; margin-top: 2px; flex-shrink: 0; }
        .agenda-item.done i { color: #10b981; }

        .timer-display { font-size: 2.5rem; font-weight: 900; font-style: italic; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        .timer-active { color: #ef4444; }
        .timer-idle { color: #1e293b; }

        .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #3b82f6; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #session-log-container { overflow-x: hidden; }
        #session-log-container * {
            max-width: 100% !important; min-width: 0 !important; box-sizing: border-box !important;
            white-space: normal !important; word-break: break-word !important;
        }
        #session-log-container [style*="width"], #session-log-container [width] { width: auto !important; }
        #session-log-container table, #session-log-container tbody, #session-log-container tr, #session-log-container td, #session-log-container th {
            display: block !important; width: auto !important; padding: 0 !important;
        }
        #session-log-container td { padding-bottom: 15px !important; }
        #session-log-container .cbUpdateButton, #session-log-container .cbSubmitButton {
            display: block !important; background-color: #2563eb !important; color: white !important;
            padding: 16px 24px !important; border-radius: 12px !important; font-weight: 900 !important;
            font-size: 14px !important; text-transform: uppercase !important; letter-spacing: 0.05em !important;
            border: none !important; width: 100% !important; box-sizing: border-box !important;
            margin-top: 24px !important; cursor: pointer !important;
        }
    </style>
</head>
<body class="bg-slate-50">

   <!-- Hidden Caspio DataPages (Session & Agenda) -->
    <div id="caspio-insert" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <div id="caspio-report" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <div id="caspio-update" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <iframe id="caspio-update-frame" name="caspio-update-frame" style="position:absolute;left:-9999px;top:-9999px;" width="0" height="0" frameborder="0"></iframe>
    
    <div id="caspio-agenda-update" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <div id="caspio-agenda-report" style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;"></div>
    <iframe id="caspio-agenda-update-frame" name="caspio-agenda-update-frame" style="position:absolute;left:-9999px;top:-9999px;" width="0" height="0" frameborder="0"></iframe>

    <div class="flex flex-col min-h-screen lg:h-screen lg:overflow-hidden">

        <!-- Top Nav -->
        <header class="bg-white border-b border-slate-100 px-6 lg:px-10 py-4 flex items-center justify-between flex-shrink-0">
            <button onclick="goBack()" class="flex items-center gap-2 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-blue-600 transition">
                <i class="fas fa-arrow-left"></i> Dashboard
            </button>
            <div class="flex items-center gap-4 text-right">
                <div>
                    <h1 class="text-lg lg:text-xl font-black italic text-slate-900 uppercase leading-none" id="coachee-name-header">Loading...</h1>
                    <p class="text-[9px] font-bold text-blue-600 uppercase tracking-widest mt-0.5 italic">Coach Connect</p>
                </div>
                <div class="w-10 h-10 lg:w-11 lg:h-11 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-black italic shadow-lg text-sm" id="coachee-initials">--</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-hidden p-4 lg:p-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 h-full fade-in">

                <!-- Left: Agenda -->
                <div class="col-span-1 lg:col-span-8 flex flex-col min-h-[500px] lg:h-full">
                    <section class="glass-card bg-slate-900 flex flex-col flex-1 overflow-hidden shadow-2xl border-none">
                        <div class="px-6 lg:px-8 py-5 border-b border-white/5 flex justify-between items-center bg-white/5">
                            <div>
                                <span class="accent-text text-blue-400 tracking-[0.2em] block">Meeting Agenda</span>
                                <span class="text-[8px] text-slate-500 font-bold uppercase italic opacity-60">Collaborative Workspace</span>
                            </div>
                            <div class="flex items-center gap-2 px-3 py-1 bg-blue-500/10 rounded-full border border-blue-500/20">
                                <div class="pulse-dot"></div>
                                <span class="text-[9px] font-black text-blue-400 uppercase italic" id="sync-status">Loading</span>
                            </div>
                        </div>

                        <div class="p-6 lg:p-8 flex-1 overflow-y-auto">
                            <ul class="space-y-3" id="agenda-list">
                                <li class="text-slate-500 text-xs italic text-center py-8">Loading agenda...</li>
                            </ul>
                        </div>

                        <div class="p-6 lg:p-8 bg-black/20 border-t border-white/5">
                            <div class="relative">
                                <input type="text" id="agenda-input" placeholder="Type new agenda item..."
                                    class="w-full bg-white/5 border border-white/10 rounded-[20px] py-4 pl-5 pr-14 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-blue-500/50 transition-all font-medium placeholder-slate-600">
                                <button onclick="addAgendaItem()" class="absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 transition">
                                    <i class="fas fa-plus text-white text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Right: Timer + Project -->
                <div class="col-span-1 lg:col-span-4 flex flex-col gap-6 lg:h-full">

                    <!-- Timer Card -->
                    <section class="glass-card p-5 lg:p-6 border-2 border-blue-600 shadow-2xl">
                        <div class="flex justify-between items-center mb-5">
                            <span class="accent-text text-blue-600 tracking-widest">Session Timer</span>
                
                        </div>
                        <div class="text-center mb-5">
                            <div class="timer-display timer-idle" id="timer-display">00:00</div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1" id="timer-status-label">Not started</p>
                        </div>
                        <div class="flex gap-3">
                            <button id="start-btn" onclick="startTimer()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-blue-500 transition shadow-lg">
                                <i class="fas fa-play mr-1"></i> Start
                            </button>
                            <button id="stop-btn" onclick="stopTimer()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-red-600 transition shadow-lg" style="display:none">
                                <i class="fas fa-stop mr-1"></i> Stop Session & Log
                            </button>
                        </div>
                    </section>

                    <!-- Project Context -->
                    <section class="glass-card p-5 lg:p-6 flex-1 flex flex-col bg-slate-50 border-slate-200 cursor-pointer hover:border-blue-300 hover:shadow-md transition-all" onclick="openCoacheeProfile()">
                        <div class="flex items-center justify-between mb-5">
                            <span class="accent-text text-slate-400 tracking-widest">Project Context</span>
                            <i class="fas fa-chevron-right text-slate-300 text-xs"></i>
                        </div>
                        <div class="space-y-5" id="project-context">
                            <div class="text-center py-8 text-slate-400 text-xs italic">Loading project info...</div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

<script>
    // ── URL Params ───────────────────────────────────────────
    // ── URL Params ───────────────────────────────────────────
    const params       = new URLSearchParams(window.location.search);
    const matchId      = params.get('match_id') || sessionStorage.getItem('match_id') || '';
    const sessionId    = params.get('session_id') || sessionStorage.getItem('session_id') || '';
    const coacheeUid   = params.get('coachee_uid') || sessionStorage.getItem('coachee_uid') || '';
    const coachUid     = params.get('coach_uid') || sessionStorage.getItem('coach_uid') || '';
    const coacheeName  = params.get('coachee_name') || sessionStorage.getItem('coachee_name') || '';
    const projectTitle = params.get('project_title') || sessionStorage.getItem('project_title') || '';
    const myName       = params.get('name') || sessionStorage.getItem('name') || '';
    const problemParam = params.get('problem') || sessionStorage.getItem('problem') || '';
    const aboutParam   = params.get('about') || sessionStorage.getItem('about') || '';

    const role         = params.get('role') || sessionStorage.getItem('role') || 'Coach';
    const myUid        = params.get('uid') || (role === 'Coachee' ? coacheeUid : coachUid) || sessionStorage.getItem('uid') || '';

    // Save all params to sessionStorage for after redirect
    if (role) sessionStorage.setItem('role', role);
    if (myUid) sessionStorage.setItem('uid', myUid);
    if (matchId) sessionStorage.setItem('match_id', matchId);
    if (sessionId) sessionStorage.setItem('session_id', sessionId);
    if (coacheeUid) sessionStorage.setItem('coachee_uid', coacheeUid);
    if (coachUid) sessionStorage.setItem('coach_uid', coachUid);
    if (coacheeName) sessionStorage.setItem('coachee_name', coacheeName);
    if (projectTitle) sessionStorage.setItem('project_title', projectTitle);
    if (problemParam) sessionStorage.setItem('problem', problemParam);
    if (aboutParam) sessionStorage.setItem('about', aboutParam);

    // Set header
    if (coacheeName) {
        document.getElementById('coachee-name-header').textContent = 'Dr. ' + coacheeName;
        const parts = coacheeName.trim().split(' ');
        const initials = parts.map(p => p[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('coachee-initials').textContent = initials;
    }

    function goBack() {
        const currentRole = params.get('role') || sessionStorage.getItem('role');
        const page = currentRole === 'Coachee' ? 'coachee.html' : 'coach.html';
        window.location.href = page + '?uid=' + encodeURIComponent(myUid) + '&name=' + encodeURIComponent(myName);
    }

    // ── Helpers ──────────────────────────────────────────────
    function getCellText(cell) {
        const span = cell.querySelector('span');
        if (span) span.remove();
        return cell.textContent.trim();
    }

    // ── Agenda (local only for now) ──────────────────────────
    let agendaItems = [];

    function renderAgenda() {
        const list = document.getElementById('agenda-list');
        if (agendaItems.length === 0) {
            list.innerHTML = '<li class="text-slate-500 text-xs italic text-center py-8">No agenda items yet. Add one below.</li>';
            return;
        }
        list.innerHTML = agendaItems.map((item, i) => `
            <li class="agenda-item ${item.done ? 'done' : ''}" onclick="toggleAgenda(${i})">
                <i class="far ${item.done ? 'fa-check-square' : 'fa-square'} mt-0.5"></i>
                <span>${item.text}</span>
            </li>
        `).join('');
    }

    function toggleAgenda(index) {
        agendaItems[index].done = !agendaItems[index].done;
        renderAgenda();
    }

    function addAgendaItem() {
        const input = document.getElementById('agenda-input');
        const text = input.value.trim();
        if (!text) return;
        agendaItems.push({ text, done: false });
        input.value = '';
        renderAgenda();
    }

    document.getElementById('agenda-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') addAgendaItem();
    });

    // ── Timer ────────────────────────────────────────────────
    let timerInterval = null;
    let timerStartMs = null;
    let timerRunning = false;
    let accumulatedSeconds = 0;

    function updateTimerDisplay(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').textContent = h > 0 ? h + ':' + m + ':' + s : m + ':' + s;
    }

    function openSessionLogModal(sessionId, elapsedMins) {
        const modal = document.getElementById('session-log-modal');
        const box = document.getElementById('session-log-box');
        const container = document.getElementById('session-log-container');

        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs font-bold uppercase tracking-widest"><i class="fas fa-spinner fa-spin mr-2"></i>Loading Form...</div>';

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = `https://c0abr823.caspio.com/dp/1c9f5000d4ac1ce784a8401d821b/emb?Session_ID=${encodeURIComponent(sessionId)}&Elapsed_Mins=${encodeURIComponent(elapsedMins)}`;
        
        setTimeout(() => {
            container.innerHTML = ''; 
            container.appendChild(script);
        }, 100);

        modal.classList.remove('hidden');
        setTimeout(() => {
            box.classList.remove('scale-95', 'opacity-0');
            box.classList.add('scale-100', 'opacity-100');
        }, 10);
    }

    function closeSessionLogModal() {
        const modal = document.getElementById('session-log-modal');
        const box = document.getElementById('session-log-box');
        const container = document.getElementById('session-log-container');
        
        box.classList.remove('scale-100', 'opacity-100');
        box.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
            container.innerHTML = '';
        }, 300);
    }

    document.addEventListener('DataPageReady', function () {
        const c = document.getElementById('session-log-container');
        if (!c || !c.children.length) return;

        const fix = el => {
            el.removeAttribute('width');
            el.style.setProperty('max-width', '100%', 'important');
            el.style.setProperty('min-width', '0', 'important');
            el.style.setProperty('box-sizing', 'border-box', 'important');
        };

        [...c.children].forEach(el => fix(el));
        c.querySelectorAll('*').forEach(el => {
            fix(el);
            if (/^(TABLE|TBODY|TR|TD|TH)$/.test(el.tagName)) {
                el.style.setProperty('display', 'block', 'important');
                el.style.setProperty('width', 'auto', 'important');
            }
        });
    });

    document.addEventListener('FormSubmitted', function(event) {
        const modal = document.getElementById('session-log-modal');
        if (!modal.classList.contains('hidden')) {
            const currentRole = params.get('role') || sessionStorage.getItem('role');
            const page = currentRole === 'Coachee' ? 'coachee.html' : 'coach.html';
            
            setTimeout(() => {
                window.location.href = page + '?uid=' + encodeURIComponent(myUid) + '&name=' + encodeURIComponent(myName);
            }, 1000);
        }
    });

    function resetTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        timerStartMs = null;
        updateTimerDisplay(0);
        document.getElementById('timer-display').classList.replace('timer-active', 'timer-idle');
        document.getElementById('timer-status-label').textContent = 'Not started';
        document.getElementById('start-btn').style.display = 'flex';
        document.getElementById('stop-btn').style.display = 'none';
        saveSession({ timerStart: '' });
    }

    // ── Load Coachee Profile ──────────────────────────────────
    function getCellText(cell) {
        const span = cell.querySelector('span');
        if (span) span.remove();
        return cell.textContent.trim();
    }

    function renderProjectContext(p) {
        const title   = p.projectTitle || projectTitle || 'No title provided';
        const problem = p.problem || problemParam || 'No problem statement provided.';
        const about   = p.about   || aboutParam   || 'No background provided.';
        document.getElementById('project-context').innerHTML = `
            <div>
                <h4 class="text-[9px] font-black text-slate-900 uppercase italic mb-2 tracking-tighter opacity-60">Project Title</h4>
                <p class="text-xs text-slate-600 font-medium leading-relaxed italic border-l-2 border-blue-500 pl-3">${title}</p>
            </div>
            <div>
                <h4 class="text-[9px] font-black text-slate-900 uppercase italic mb-2 tracking-tighter opacity-60">Problem Statement</h4>
                <p class="text-xs text-slate-600 font-medium leading-relaxed italic border-l-2 border-slate-300 pl-3">${problem}</p>
            </div>
            <div>
                <h4 class="text-[9px] font-black text-slate-900 uppercase italic mb-2 tracking-tighter opacity-60">About</h4>
                <p class="text-xs text-slate-600 font-medium leading-relaxed italic border-l-2 border-slate-300 pl-3">${about}</p>
            </div>
        `;
    }

    // ── Session ──────────────────────────────────────────────
    let currentSessionId = sessionId || '';
    let sessionInsertDone = false; // hard guard: max ONE insert per page load
    let generatedSessionId = null; // client-generated ID (used if insert form has a Session_ID field)

    const SESSION_REPORT_URL = 'https://c0abr823.caspio.com/dp/1c9f50008d6578f1dda0494d85a7';

    function initSession() {
        if (currentSessionId) {
            document.getElementById('sync-status').textContent = 'Live';
            
            fetchActiveSession().then(found => {
                if (found) {        
                    accumulatedSeconds = found.accumulatedSeconds || 0;
                    const timerStartVal = found.timerStartVal;

                    if (timerStartVal && !timerRunning) {
                        const startMs = new Date(timerStartVal).getTime();
                        if (!isNaN(startMs)) {
                            timerRunning = true;
                            timerStartMs = startMs;
                            document.getElementById('timer-display').classList.replace('timer-idle', 'timer-active');
                            document.getElementById('timer-status-label').textContent = 'In progress';
                            document.getElementById('start-btn').style.display = 'none';
                            document.getElementById('stop-btn').style.display = 'flex';
                            
                            clearInterval(timerInterval);
                            timerInterval = setInterval(() => {
                                let activeSecs = Math.floor((Date.now() - timerStartMs) / 1000);
                                updateTimerDisplay(accumulatedSeconds + activeSecs);
                            }, 1000);
                        }
                    } else if (!timerStartVal && !timerRunning) {
                        updateTimerDisplay(accumulatedSeconds);
                    }
                }
            }).catch(() => {});
            return;
        }
        
        document.getElementById('sync-status').textContent = 'Loading...';
        checkExistingSession(0);
    }

    // Read the Active session row by injecting the report EMBED script into a hidden div.
    // NOTE: plain fetch() does NOT work — Caspio rejects cookieless cross-origin requests
    // ("This app requires cookies"). Script embeds DO carry cookies, so this is the only
    // reliable read path (same mechanism that successfully loads the insert form).
    let reportBusy = false;
    const REPORT_PARAM_NAMES = ['match_id', 'Match_ID'];

    function fetchActiveSession() {
        return tryReportParam(0);
    }

    function tryReportParam(i) {
        if (i >= REPORT_PARAM_NAMES.length) return Promise.resolve(null);
        return loadReportEmb(REPORT_PARAM_NAMES[i]).then(found => found || tryReportParam(i + 1));
    }

    function loadReportEmb(paramName) {
        return new Promise((resolve, reject) => {
            if (reportBusy) { reject(new Error('report busy')); return; }
            reportBusy = true;
            const container = document.getElementById('caspio-report');
            container.innerHTML = '';
            const s = document.createElement('script');
            s.src = SESSION_REPORT_URL + '/emb?' + paramName + '=' + encodeURIComponent(matchId) + '&cbCache=' + Date.now();
            container.appendChild(s);

            let tries = 0;
            (function poll() {
                const table = container.querySelector('table');
                const rawText = container.textContent || '';
                const text = rawText.toLowerCase();

                if (table) {
                    let result = null;
                    table.querySelectorAll('tr').forEach(row => {
                        const cells = row.querySelectorAll('td');
                        if (!result && cells.length >= 3) {
                            if (cells.length >= 5) {
                                console.log('[디버깅] 5번째 컬럼 원본 텍스트:', getCellText(cells[4]));
                            }
                            
                            result = {
                                sessionId: getCellText(cells[0]),
                                agendaRaw: null, 
                                timerStartVal: cells.length >= 4 ? getCellText(cells[3]) : '',
                                accumulatedSeconds: cells.length >= 5 ? parseInt(getCellText(cells[4]).replace(/[^0-9]/g, ''), 10) || 0 : 0
                            };
                        }
                    });
                    console.log('[session-report:emb]', paramName, '| table rendered | result:', result, '| text:', rawText.replace(/\s+/g, ' ').slice(0, 200));
                    reportBusy = false;
                    resolve(result);
                } else if (text.includes('no record') || text.includes('no data')) {
                    console.log('[session-report:emb]', paramName, '| no records');
                    reportBusy = false;
                    resolve(null);
                } else if (text.includes('requires cookies')) {
                    reportBusy = false;
                    reject(new Error('cookies blocked'));
                } else if (tries++ < 40) {
                    setTimeout(poll, 300);
                } else {
                    console.warn('[session-report:emb]', paramName, '| timeout | text:', rawText.replace(/\s+/g, ' ').slice(0, 300));
                    reportBusy = false;
                    reject(new Error('report render timeout'));
                }
            })();
        });
    }

    function adoptSession(sid, agendaRaw) {
        currentSessionId = sid;
        sessionStorage.setItem('session_id', currentSessionId);
        if (agendaRaw !== undefined && agendaRaw !== null) {
            try {
                const loaded = JSON.parse(agendaRaw);
                agendaItems = loaded.filter(item => !item.done);
            } catch(e) {
                agendaItems = [];
            }
            renderAgenda();
        }
        document.getElementById('sync-status').textContent = 'Live';
    }

    function checkExistingSession(tries) {
        fetchActiveSession().then(found => {
            if (found && found.sessionId) {
                adoptSession(found.sessionId, found.agendaRaw);
            } else if (!sessionInsertDone) {
                // No Active session and we haven't inserted yet → create exactly once
                createNewSession();
            } else if (tries < 10) {
                // We already inserted; wait for the row to appear — NEVER insert again.
                setTimeout(() => checkExistingSession(tries + 1), 1000);
            } else {
                document.getElementById('sync-status').textContent = 'Error';
                console.error('[session] Inserted a row but the report never returned it. Check the report DataPage config (parameter name, Status filter).');
            }
        }).catch(err => {
            console.warn('Session check failed:', err);
            if (err && err.message === 'cookies blocked') {
                document.getElementById('sync-status').textContent = 'Error';
                console.error('[session] Caspio says cookies are blocked even for the embed. Check browser third-party cookie settings.');
            } else if (tries < 10) {
                setTimeout(() => checkExistingSession(tries + 1), 1000);
            } else {
                document.getElementById('sync-status').textContent = 'Offline';
            }
        });
    }

    function createNewSession() {
        sessionInsertDone = true; // set BEFORE any async work — guarantees single insert
        document.getElementById('sync-status').textContent = 'Starting...';
        const container = document.getElementById('caspio-insert');
        container.innerHTML = '';
        const s = document.createElement('script');
        s.src = 'https://c0abr823.caspio.com/dp/1c9f500099edf2611dd64a8fa537/emb?match_id=' + encodeURIComponent(matchId);
        container.appendChild(s);
        waitForInsertForm(0);
    }

    function waitForInsertForm(tries) {
        const form = document.querySelector('#caspio-insert form');
        if (form) {
            let matchField = document.getElementById('InsertRecordMatch_ID') || document.querySelector('#caspio-insert input[name*="Match_ID"]');
            if (matchField) matchField.value = matchId;

            let statusField = document.getElementById('InsertRecordStatus') || document.querySelector('#caspio-insert select[name*="Status"], #caspio-insert input[name*="Status"]');
            if (statusField) statusField.value = 'Active';

            // If the insert form exposes a Session_ID field, generate the ID ourselves.
            // Then we don't need to read anything back from the report.
            let sidField = document.getElementById('InsertRecordSession_ID') || document.querySelector('#caspio-insert input[name*="Session_ID"]');
            if (sidField) {
                generatedSessionId = 'S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
                sidField.value = generatedSessionId;
            }
            console.log('[session-insert] fields — match:', !!matchField, 'agenda:', !!agendaField, 'status:', !!statusField, 'session_id:', !!sidField);

            form.target = 'caspio-update-frame';
            
            document.getElementById('caspio-update-frame').onload = function() {
                document.getElementById('caspio-update-frame').onload = null; 
                if (generatedSessionId) {
                    // We set the ID ourselves — adopt immediately, no report round-trip needed
                    adoptSession(generatedSessionId, null);
                } else {
                    setTimeout(() => {
                        checkExistingSession(1); // re-check only; sessionInsertDone blocks re-insert
                    }, 1000);
                }
            };
            
            form.submit();
        } else if (tries < 30) {
            setTimeout(() => waitForInsertForm(tries + 1), 300);
        } else {
            document.getElementById('sync-status').textContent = 'Error';
        }
    }

    // Save via Caspio embed form, targeting hidden iframe to prevent page reload
    let updateDataPageLoaded = false;

    function ensureUpdateDataPage(callback) {
        if (updateDataPageLoaded) {
            callback();
            return;
        }
        const container = document.getElementById('caspio-update');
        container.innerHTML = '';
        const s = document.createElement('script');
        s.src = 'https://c0abr823.caspio.com/dp/1c9f500037d48cb67ee441fc8907/emb?Session_ID=' + encodeURIComponent(currentSessionId);
        container.appendChild(s);
        waitForUpdatePage(callback, 0);
    }

    function waitForUpdatePage(callback, tries) {
        const form = document.querySelector('#caspio-update form');
        if (form) {
            updateDataPageLoaded = true;
            callback();
        } else if (tries < 30) {
            setTimeout(() => waitForUpdatePage(callback, tries + 1), 300);
        }
    }

    function saveSession(data) {
        if (!currentSessionId) return;
        ensureUpdateDataPage(() => {
            const form = document.querySelector('#caspio-update form');
            if (!form) return;

            if (data.timerStart !== undefined) {
                const f = document.getElementById('EditRecordTimer_Start');
                if (f) f.value = data.timerStart;
            }
            if (data.status !== undefined) {
                const f = document.getElementById('EditRecordStatus') || document.querySelector('#caspio-update select[name*="Status"], #caspio-update input[name*="Status"]');
                if (f) f.value = data.status;
            }
            if (data.accumulatedSeconds !== undefined) {
                const f = document.getElementById('EditRecordAccumulated_Seconds') || document.querySelector('#caspio-update input[name*="Accumulated_Seconds"]');
                if (f) f.value = data.accumulatedSeconds;
            }

            form.target = 'caspio-update-frame';
            form.submit();
        });
    }

    // ── Global Agenda ────────────────────────────────
    let agendaUpdateLoaded = false;

    function saveGlobalAgenda(agendaStr) {
        if (!matchId) return;
        const container = document.getElementById('caspio-agenda-update');
        
        if (!agendaUpdateLoaded) {
            container.innerHTML = '';
            const s = document.createElement('script');
            s.src = 'https://c0abr823.caspio.com/dp/1c9f50006501962c2ebb4f17a322/emb?match_id=' + encodeURIComponent(matchId);
            container.appendChild(s);
        }

        let tries = 0;
        (function poll() {
            const form = document.querySelector('#caspio-agenda-update form');
            if (form) {
                agendaUpdateLoaded = true;
                const f = document.getElementById('EditRecordAgenda') || document.querySelector('#caspio-agenda-update input[name*="Agenda"], #caspio-agenda-update textarea[name*="Agenda"]');
                if (f) f.value = agendaStr;
                form.target = 'caspio-agenda-update-frame';
                form.submit();
            } else if (tries++ < 30) {
                setTimeout(poll, 300);
            }
        })();
    }

    const _origToggle = toggleAgenda;
    toggleAgenda = function(index) {
        agendaItems[index].done = !agendaItems[index].done;
        renderAgenda();
        saveGlobalAgenda(JSON.stringify(agendaItems)); 
    };

    const _origAdd = addAgendaItem;
    addAgendaItem = function() {
        const input = document.getElementById('agenda-input');
        const text = input.value.trim();
        if (!text) return;
        agendaItems.push({ text, done: false });
        input.value = '';
        renderAgenda();
        saveGlobalAgenda(JSON.stringify(agendaItems)); 
    };

    function startTimer() {
        if (!currentSessionId) {
            alert("Session is connecting. Please wait until the status is 'Live' to start the timer.");
            return;
        }

        if (timerRunning) return;
        timerRunning = true;
        timerStartMs = Date.now();
        
        document.getElementById('timer-display').classList.replace('timer-idle', 'timer-active');
        document.getElementById('timer-status-label').textContent = 'In progress';
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'flex';
        
        saveSession({ timerStart: new Date(timerStartMs).toISOString() });
        
        timerInterval = setInterval(() => {
            let activeSecs = Math.floor((Date.now() - timerStartMs) / 1000);
            updateTimerDisplay(accumulatedSeconds + activeSecs);
        }, 1000);
    }

    function stopTimer() {
        if (!timerRunning) return;

        let currentActiveSecs = Math.floor((Date.now() - timerStartMs) / 1000);
        accumulatedSeconds += currentActiveSecs;
        
        let elapsedMins = Math.max(1, Math.floor(accumulatedSeconds / 60));

        clearInterval(timerInterval);
        timerRunning = false;
        timerStartMs = null;
        
        document.getElementById('timer-display').classList.replace('timer-active', 'timer-idle');
        document.getElementById('timer-status-label').textContent = 'Paused / Logging';
        document.getElementById('start-btn').style.display = 'flex';
        document.getElementById('stop-btn').style.display = 'none';
        
        saveSession({ timerStart: '', accumulatedSeconds: accumulatedSeconds }); 

        openSessionLogModal(currentSessionId, elapsedMins);
    }

    function openCoacheeProfile() {
        const url = 'coachee_profile_detail.html?uid=' + encodeURIComponent(coacheeUid)
            + '&match_id=' + encodeURIComponent(matchId)
            + '&coachee_uid=' + encodeURIComponent(coacheeUid)
            + '&coach_uid=' + encodeURIComponent(myUid)
            + '&name=' + encodeURIComponent(myName)
            + '&coachee_name=' + encodeURIComponent(coacheeName);
        window.location.href = url;
    }

    // ── Init ─────────────────────────────────────────────────
    document.getElementById('sync-status').textContent = 'Ready';
    renderAgenda();
    updateTimerDisplay(0);
    renderProjectContext({});
    initSession();

    // ── Global Agenda  ─────────────────────────────────
    let agendaReportBusy = false;
    function loadGlobalAgenda() {
        if (agendaReportBusy || !matchId) return;
        agendaReportBusy = true;
        const container = document.getElementById('caspio-agenda-report');
        container.innerHTML = '';
        const s = document.createElement('script');
        s.src = 'https://c0abr823.caspio.com/dp/1c9f5000b0cbf57780ab431a8560/emb?match_id=' + encodeURIComponent(matchId) + '&cbCache=' + Date.now();
        container.appendChild(s);

        let tries = 0;
        (function poll() {
            const table = container.querySelector('table');
            if (table) {
                let agendaRaw = '[]';
                table.querySelectorAll('tr').forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length > 0) {
                        let text = cells[0].textContent.trim();
                        if (text && text !== 'No records found.') {
                            agendaRaw = text;
                        }
                    }
                });
                
                try {
                    const loaded = JSON.parse(agendaRaw);
                    const unchecked = loaded.filter(item => !item.done);
                    if (JSON.stringify(unchecked) !== JSON.stringify(agendaItems)) {
                        agendaItems = unchecked;
                        renderAgenda();
                    }
                } catch(e) {}
                agendaReportBusy = false;
            } else if (tries++ < 40) {
                setTimeout(poll, 300);
            } else {
                agendaReportBusy = false;
            }
        })();
    }

    loadGlobalAgenda(); 

    // ── Silent Polling: Session(Timer) & Global Agenda (Every 5s) ───
    setInterval(() => {
        loadGlobalAgenda();

        if (!currentSessionId) return;

        fetchActiveSession()
            .then(found => {
                if (!found) return;

                accumulatedSeconds = found.accumulatedSeconds || 0;
                const timerStartVal = found.timerStartVal;

                if (timerStartVal && !timerRunning) {
                    const startMs = new Date(timerStartVal).getTime();
                    if (!isNaN(startMs)) {
                        timerRunning = true;
                        timerStartMs = startMs;
                        document.getElementById('timer-display').classList.replace('timer-idle', 'timer-active');
                        document.getElementById('timer-status-label').textContent = 'In progress';
                        document.getElementById('start-btn').style.display = 'none';
                        document.getElementById('stop-btn').style.display = 'flex';
                        clearInterval(timerInterval);
                        
                        timerInterval = setInterval(() => {
                            let activeSecs = Math.floor((Date.now() - timerStartMs) / 1000);
                            updateTimerDisplay(accumulatedSeconds + activeSecs);
                        }, 1000);
                    }
                } else if (!timerStartVal && timerRunning) {
                    clearInterval(timerInterval);
                    timerRunning = false;
                    timerStartMs = null;
                    
                    document.getElementById('timer-display').classList.replace('timer-active', 'timer-idle');
                    document.getElementById('timer-status-label').textContent = 'Paused';
                    document.getElementById('start-btn').style.display = 'flex';
                    document.getElementById('stop-btn').style.display = 'none';
                    updateTimerDisplay(accumulatedSeconds); 
                } else if (!timerStartVal && !timerRunning) {
                    updateTimerDisplay(accumulatedSeconds);
                }
            })
            .catch(err => { /* busy or transient — skip this cycle */ });
    }, 5000);

</script>

    <div id="session-log-modal" class="hidden fixed inset-0 z-[9999] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden transform scale-95 opacity-0 transition-all duration-300 flex flex-col max-h-[90vh]" id="session-log-box">
            
            <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                <div>
                    <h3 class="text-lg font-black text-slate-800 tracking-tight">Log Session & Schedule</h3>
                    <p class="text-xs text-slate-500 mt-1">Review your session time and schedule the next meeting.</p>
                </div>
                <button onclick="closeSessionLogModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-8 overflow-y-auto bg-white min-h-[300px]" id="session-log-container"></div>
            
        </div>
    </div>
